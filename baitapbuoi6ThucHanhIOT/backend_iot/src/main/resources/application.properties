spring.application.name=backend_iot

# Server port
server.port=8080

# MQTT Configuration
mqtt.broker=tcp://localhost:1883
mqtt.clientId=backend-iot-client
mqtt.subscribeTopic=iot/demo/#
mqtt.namespace=iot/demo
mqtt.deviceCmdTopic=iot/demo/device/cmd
mqtt.deviceStateTopic=iot/demo/device/state

# MySQL datasource (adjust username/password/db URL as needed)
spring.datasource.url=jdbc:mysql://localhost:3306/iot_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.backend_iot.backend_iot=INFO
logging.level.org.eclipse.paho.client.mqttv3=DEBUG
