spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iotdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: iotuser
    password: secret

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis configuration for Lab 6 bài tập 3  
  data:
    redis:
      host: localhost
      port: 6379
      password: # leave empty if no password
      timeout: 2000ms
      database: 0

mqtt:
  host: localhost
  port: 1883
  username: ""
  password: ""
  clientId: iot-backend-${random.uuid}
  topicTemp: iot/demo/temp
  topicHum: iot/demo/hum
  topicCmd: iot/demo/cmd
  qos: 1
  keepAlive: 30

